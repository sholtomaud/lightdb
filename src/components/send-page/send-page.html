<section class="panel">
  <h1>send</h1>
  <p class="muted">
    Point the other device's camera at this screen. The stream loops forever —
    stop it when the receiver says it is done.
  </p>
</section>

<section class="panel">
  <h2>peer</h2>
  <div class="row">
    <input type="text" id="peer-input" placeholder="peer actor id (optional)" autocomplete="off" spellcheck="false" />
  </div>
  <p class="muted">
    Naming a peer you have synced with before sends only what it is missing.
    Leave it blank to send the whole op log.
  </p>
</section>

<canvas id="qr-canvas" width="720" height="720" aria-label="Animated QR transmission"></canvas>

<section class="panel">
  <div class="row">
    <button class="btn" id="start-btn">start transmitting</button>
    <button class="btn" id="stop-btn" disabled>stop</button>
  </div>
  <p class="muted" data-status>Idle.</p>
  <dl class="stats">
    <div><dt>payload</dt><dd data-payload>—</dd></div>
    <div><dt>blocks</dt><dd data-blocks>—</dd></div>
    <div><dt>frames</dt><dd data-frames>0</dd></div>
    <div><dt>passes</dt><dd data-passes>0.00</dd></div>
  </dl>
</section>
